[project]
name = "iyf"
version = "0.1.0"
description = "Minimal library and CLI for downloading iyf.tv and iyf.lv videos"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "typer>=0.12",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
iyf = "iyf.cli:app"

[dependency-groups]
dev = [
    "basedpyright>=1.31",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iyf"]

[tool.hatch.build.targets.wheel.force-include]
"iyf/SKILL.md" = "iyf/SKILL.md"

[tool.basedpyright]
include = ["iyf"]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I"]
